{% extends 'base.html' %}

{% block content %}
<h2>Donations</h2>
<a href="/add_donation" class="btn btn-success mb-3">Add Donation</a>

<table class="table table-bordered">
    <tr>
        <th>Donor</th>
        <th>Amount</th>
        <th>Purpose</th>
    </tr>

    {% for donation in donations %}
    <tr>
        <td>{{ donation.donor_name }}</td>
        <td>₹ {{ donation.amount }}</td>
        <td>{{ donation.purpose }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
